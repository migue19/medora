# Ejemplo de vhost para Medora. Adaptar dominio y certificados antes de habilitar.
server {
    listen 443 ssl;
    http2 on;
    server_name medora.tu-dominio.com;

    ssl_certificate     /etc/letsencrypt/live/medora.tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medora.tu-dominio.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # sobrescribe: el cliente no puede falsificar su IP
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:6011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name medora.tu-dominio.com;
    return 301 https://$host$request_uri;
}
